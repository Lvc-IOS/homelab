services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: dash.${DOMAIN}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]

networks:
  proxy:
    external: true
